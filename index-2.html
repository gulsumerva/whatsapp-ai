<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075E54">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chat</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Roboto,"Segoe UI",system-ui,sans-serif;background:#ECE5DD;color:#111}
#app{display:flex;flex-direction:column;height:100dvh;max-width:700px;margin:0 auto;background:#ECE5DD;position:relative}
header{background:#075E54;color:#fff;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 6px) 4px 8px 4px;box-shadow:0 1px 4px rgba(0,0,0,.35);z-index:5}
header button{background:none;border:0;color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
header button:active{background:rgba(255,255,255,.15)}
.avatar{width:40px;height:40px;border-radius:50%;background:#128C7E center/cover no-repeat;flex:none;display:grid;place-items:center;font-weight:600;font-size:18px;cursor:pointer;overflow:hidden}
.who{flex:1;min-width:0;margin-left:6px;cursor:pointer}
.who b{display:block;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:12.5px;opacity:.85;height:16px}
#chat{flex:1;overflow-y:auto;padding:10px 8px 8px;display:flex;flex-direction:column;gap:3px;
background-color:#ECE5DD;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180' fill='none' stroke='%23b9ad9c' stroke-opacity='.35' stroke-width='1.6' stroke-linecap='round'><circle cx='30' cy='28' r='9'/><path d='M26 27h.01M34 27h.01M26 32q4 3 8 0'/><path d='M100 20l8 14h-16z'/><path d='M150 30c-8-8-18 4-8 12 8-4 16-4 8-12z'/><rect x='24' y='88' width='20' height='14' rx='3'/><path d='M24 92l10 6 10-6'/><path d='M96 92q10-14 20 0t-20 16'/><circle cx='150' cy='96' r='7'/><path d='M150 89v-6M150 109v6M143 96h-6M157 96h6'/><path d='M40 150l10-10 10 10-10 10z'/><path d='M110 140h22M110 148h16M110 156h20'/><path d='M158 150l-6 12h12z'/></svg>");background-size:180px}
.day{align-self:center;background:#E1F2FB;color:#54656f;font-size:12.5px;padding:5px 12px;border-radius:8px;margin:8px 0;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.sys{align-self:center;background:#FFF3C4;color:#54656f;font-size:12.5px;padding:6px 12px;border-radius:8px;margin:6px 16px;text-align:center;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.msg{max-width:82%;padding:6px 8px 5px 9px;border-radius:8px;font-size:15.5px;line-height:1.3;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.15);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.in{align-self:flex-start;background:#fff;border-top-left-radius:0}
.msg.out{align-self:flex-end;background:#DCF8C6;border-top-right-radius:0}
.msg.first.in::before,.msg.first.out::before{content:"";position:absolute;top:0;border:7px solid transparent}
.msg.first.in::before{left:-7px;border-top-color:#fff;border-right-color:#fff}
.msg.first.out::before{right:-7px;border-top-color:#DCF8C6;border-left-color:#DCF8C6}
.meta{float:right;margin:7px 0 -3px 10px;font-size:11px;color:#667781;display:flex;align-items:center;gap:3px;user-select:none}
.msg img{display:block;max-width:100%;max-height:300px;border-radius:6px;margin-bottom:3px;cursor:pointer}
.tick{width:17px;height:11px}
.tick path{fill:none;stroke:#8696a0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tick.read path{stroke:#34B7F1}
#bar{display:flex;align-items:flex-end;gap:6px;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);background:transparent}
.field{flex:1;background:#fff;border-radius:24px;display:flex;align-items:flex-end;padding:2px 4px;min-height:46px;box-shadow:0 1px 1px rgba(0,0,0,.15)}
.field button{background:none;border:0;width:40px;height:42px;display:grid;place-items:center;color:#8696a0;cursor:pointer;flex:none}
#txt{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:16px;padding:12px 4px;max-height:120px;background:transparent;line-height:1.25}
#send{width:48px;height:48px;border-radius:50%;border:0;background:#128C7E;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.3)}
#send:active{background:#075E54}
#emoji{display:none;background:#fff;border-top:1px solid #ddd;padding:8px;max-height:190px;overflow-y:auto;flex-wrap:wrap;gap:2px}
#emoji.open{display:flex}
#emoji span{font-size:26px;width:12.5%;text-align:center;padding:5px 0;cursor:pointer}
#menu{position:absolute;top:calc(env(safe-area-inset-top,0px) + 50px);right:8px;background:#fff;color:#111;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20;display:none;min-width:190px;padding:6px 0}
#menu.open{display:block}
#menu div{padding:13px 18px;font-size:16px;cursor:pointer}
#menu div:active{background:#eee}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet h2{font-size:19px;color:#075E54;margin-bottom:14px}
.sheet label{display:block;font-size:13px;color:#667781;margin:12px 0 4px}
.sheet input[type=text],.sheet input[type=password],.sheet select,.sheet textarea{width:100%;font:inherit;font-size:15px;padding:10px;border:1px solid #cfd8dc;border-radius:8px;outline:0;background:#fff}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:#128C7E}
.sheet textarea{min-height:90px;resize:vertical}
.prow{display:flex;align-items:center;gap:14px}
.prow .avatar{width:64px;height:64px;font-size:26px}
.btn{border:0;border-radius:22px;padding:10px 18px;font:inherit;font-size:15px;cursor:pointer;background:#128C7E;color:#fff}
.btn.ghost{background:#e7f3f1;color:#075E54}
.btn.danger{background:#fde8e8;color:#c62828}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hint{font-size:12px;color:#8696a0;margin-top:4px}
#viewer{position:absolute;inset:0;background:#000;z-index:40;display:none;align-items:center;justify-content:center}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:100%}
.typing-dots{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="back" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
    <div class="avatar" id="hAvatar"></div>
    <div class="who" id="who"><b id="hName"></b><small id="status">online</small></div>
    <button id="menuBtn" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </header>
  <div id="menu">
    <div data-a="settings">Settings &amp; API</div>
    <div data-a="export">Export chat</div>
    <div data-a="clear">Clear chat</div>
  </div>
  <div id="chat"></div>
  <div id="emoji"></div>
  <div id="bar">
    <div class="field">
      <button id="emojiBtn" aria-label="Emoji"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M8.5 14.5q3.5 3.5 7 0M9 9.5h.01M15 9.5h.01"/></svg></button>
      <textarea id="txt" rows="1" placeholder="Message" enterkeyhint="send"></textarea>
      <button id="attachBtn" aria-label="Attach"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg></button>
    </div>
    <button id="send" aria-label="Send"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
  </div>

  <div class="modal" id="modal">
    <div class="sheet">
      <h2>Settings</h2>
      <div class="prow">
        <div class="avatar" id="sAvatar"></div>
        <div><button class="btn ghost" id="picBtn" type="button">Change photo</button><div class="hint">Stored on this device only</div></div>
      </div>
      <label>Contact name</label>
      <input type="text" id="sName" maxlength="30">
      <label>AI provider</label>
      <select id="sProv">
        <option value="groq">Groq API (fast, free tier)</option>
        <option value="custom">Custom OpenAI-compatible</option>
      </select>
      <div id="customBox" style="display:none">
        <label>Base URL</label>
        <input type="text" id="sUrl" placeholder="https://api.openai.com/v1">
      </div>
      <label>Model</label>
      <input type="text" id="sModel" placeholder="llama-3.3-70b-versatile">
      <label>API key</label>
      <input type="password" id="sKey" placeholder="gsk_..." autocomplete="off">
      <div class="hint">Get a free key at console.groq.com. Saved in your browser's localStorage and sent only to the provider.</div>
      <label>Persona / backstory</label>
      <textarea id="sPersona" placeholder="Best friend since high school, sarcastic, loves movies"></textarea>
      <div class="actions">
        <button class="btn" id="saveBtn">Save</button>
        <button class="btn ghost" id="closeBtn">Cancel</button>
      </div>
      <div class="actions">
        <button class="btn ghost" id="expBtn">Export chat</button>
        <button class="btn danger" id="clrBtn">Clear chat</button>
      </div>
    </div>
  </div>
  <div id="viewer"><img alt=""></div>
  <input type="file" id="chatPic" accept="image/*" hidden>
  <input type="file" id="avPic" accept="image/*" hidden>
</div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const SYS_RULES="You are a real person texting a friend on WhatsApp. Never sound like an AI assistant. Never write essays or offer customer support. Text informally: use short casual sentences, occasional typos or lowercase, slang where natural, and realistic reactions. Ask personal, fun, or curious questions naturally like a close companion.";
const DEF={name:"Alex",avatar:"",provider:"groq",url:"https://api.openai.com/v1",model:"llama-3.3-70b-versatile",key:"",persona:"Best friend since high school, sarcastic, loves movies, always up for gossip and late-night snacks."};
let S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem("wa_settings")||"{}"))}catch(e){}
const saveS=()=>{try{localStorage.setItem("wa_settings",JSON.stringify(S))}catch(e){alert("Storage full: try a smaller profile photo.")}};

/* ---------- IndexedDB ---------- */
let db;
const dbOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open("wa_chat",1);r.onupgradeneeded=()=>r.result.createObjectStore("msgs",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=m=>db.transaction("msgs",m).objectStore("msgs");
const dbAll=()=>new Promise(res=>{const q=tx("readonly").getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])});
const dbAdd=m=>new Promise(res=>{const q=tx("readwrite").add(m);q.onsuccess=()=>{m.id=q.result;res(m)};q.onerror=()=>res(m)});
const dbPut=m=>new Promise(res=>{const q=tx("readwrite").put(m);q.onsuccess=()=>res();q.onerror=()=>res()});
const dbClear=()=>new Promise(res=>{const q=tx("readwrite").clear();q.onsuccess=()=>res();q.onerror=()=>res()});

/* ---------- UI helpers ---------- */
const chat=$("#chat");
let msgs=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmtT=t=>new Date(t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const dayLbl=t=>{const d=new Date(t),n=new Date(),y=new Date(Date.now()-864e5);
  if(d.toDateString()===n.toDateString())return"TODAY";
  if(d.toDateString()===y.toDateString())return"YESTERDAY";
  return d.toLocaleDateString([], {day:"numeric",month:"long",year:"numeric"}).toUpperCase()};
const scrollDown=()=>{chat.scrollTop=chat.scrollHeight};
const initial=()=>(S.name||"?").trim().charAt(0).toUpperCase();
function paintAvatar(el){el.style.backgroundImage=S.avatar?`url(${S.avatar})`:"";el.textContent=S.avatar?"":initial()}
function paintHeader(){$("#hName").textContent=S.name||"Contact";document.title=S.name||"Chat";paintAvatar($("#hAvatar"));paintAvatar($("#sAvatar"))}
const TICK='<svg class="tick{c}" viewBox="0 0 17 11"><path d="M1 6l3.2 3.2L10.5 1.5M6.5 8.2l.9.9L13.8 1.5"/></svg>';
let lastDay="",lastRole="";
function addBubble(m,animate){
  const d=dayLbl(m.t);
  if(d!==lastDay){const e=document.createElement("div");e.className="day";e.textContent=d;chat.appendChild(e);lastDay=d;lastRole=""}
  if(m.role==="sys"){const e=document.createElement("div");e.className="sys";e.textContent=m.text;chat.appendChild(e);lastRole="";return e}
  const el=document.createElement("div");
  const out=m.role==="user";
  el.className="msg "+(out?"out":"in")+(lastRole!==m.role?" first":"");
  lastRole=m.role;
  if(m.img){const im=document.createElement("img");im.src=m.img;im.alt="photo";im.onclick=()=>{$("#viewer img").src=m.img;$("#viewer").classList.add("open")};el.appendChild(im)}
  if(m.text){el.appendChild(document.createTextNode(m.text))}
  const meta=document.createElement("span");meta.className="meta";
  meta.innerHTML=fmtT(m.t)+(out?TICK.replace("{c}",m.read?" read":""):"");
  el.appendChild(meta);
  chat.appendChild(el);
  if(out)m._el=el;
  scrollDown();
  return el;
}
function markRead(m){m.read=true;dbPut(strip(m));if(m._el){const t=m._el.querySelector(".tick");if(t)t.classList.add("read")}}
const strip=m=>{const c=Object.assign({},m);delete c._el;return c};
async function post(m){m.t=m.t||Date.now();await dbAdd(strip(m)).then(r=>m.id=r.id);msgs.push(m);addBubble(m);return m}

/* ---------- AI ---------- */
function buildPrompt(){
  return SYS_RULES+"\nYour name is "+(S.name||"Alex")+". Persona and backstory: "+(S.persona||DEF.persona)+"\nStay in character at all times. Keep most replies to 1-2 short sentences; split thoughts into separate short lines like real texts. Never mention being an AI or a language model.";
}
function history(){
  return msgs.filter(m=>m.role!=="sys").slice(-30).map(m=>({
    role:m.role==="user"?"user":"assistant",
    content:(m.img?"[sent you a photo] ":"")+(m.text||"")
  }));
}
async function callAI(){
  const base=S.provider==="groq"?"https://api.groq.com/openai/v1":(S.url||"").replace(/\/+$/,"");
  const res=await fetch(base+"/chat/completions",{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.key},
    body:JSON.stringify({model:S.model||DEF.model,temperature:0.95,max_tokens:220,
      messages:[{role:"system",content:buildPrompt()}].concat(history())})});
  if(!res.ok){let e="";try{e=(await res.json()).error.message}catch(_){}throw new Error("API "+res.status+(e?": "+e:""))}
  const j=await res.json();
  return (j.choices&&j.choices[0]&&j.choices[0].message.content||"").trim();
}
let busy=false,pending=false;
const status=$("#status");
async function reply(){
  if(busy){pending=true;return}
  if(!S.key){await post({role:"sys",text:"Add your free Groq API key in Settings (3-dot menu) so "+(S.name||"your friend")+" can reply."});return}
  busy=true;
  try{
    await sleep(500+Math.random()*600);
    msgs.filter(m=>m.role==="user"&&!m.read).forEach(markRead);
    status.textContent="typing...";
    const minDelay=sleep(1500+Math.random()*1500);
    let txt="";
    try{txt=await callAI()}catch(e){await minDelay;status.textContent="online";await post({role:"sys",text:"Couldn't reach the AI. "+e.message});busy=false;return}
    await minDelay;
    let parts=txt.split(/\n+/).map(s=>s.trim()).filter(Boolean).slice(0,4);
    if(!parts.length)parts=["..."];
    for(let i=0;i<parts.length;i++){
      if(i>0){status.textContent="typing...";await sleep(900+Math.min(parts[i].length*30,1400))}
      status.textContent="online";
      await post({role:"assistant",text:parts[i]});
    }
  }finally{status.textContent="online";busy=false;if(pending){pending=false;reply()}}
}

/* ---------- sending ---------- */
const txt=$("#txt");
txt.addEventListener("input",()=>{txt.style.height="auto";txt.style.height=Math.min(txt.scrollHeight,120)+"px"});
async function sendText(){
  const v=txt.value.trim();if(!v)return;
  txt.value="";txt.style.height="auto";
  $("#emoji").classList.remove("open");
  await post({role:"user",text:v,read:false});
  reply();
}
$("#send").onclick=sendText;
txt.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();sendText()}});

function resizeImg(file,max,q){return new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;
  r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.src=r.result};
  r.readAsDataURL(file)})}
$("#attachBtn").onclick=()=>$("#chatPic").click();
$("#chatPic").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const data=await resizeImg(f,1024,.82);const cap=txt.value.trim();txt.value="";txt.style.height="auto";
    await post({role:"user",text:cap,img:data,read:false});reply()}
  catch(_){await post({role:"sys",text:"Couldn't load that photo."})}
};

/* ---------- emoji ---------- */
const EM="😀 😁 😂 🤣 😊 😍 😘 😎 🥺 😭 😅 😉 🙄 😴 🤔 😡 🥰 😏 🤗 😬 🙈 🙏 👍 👎 👏 🙌 💪 🔥 ✨ 💯 ❤️ 💔 🎉 🍕 🍿 🎬 ☕ 🍻 🌙 😋 🤯 😱 🤭 😇 🥳 😤 🫶 👀 💀".split(" ");
const emo=$("#emoji");
EM.forEach(x=>{const s=document.createElement("span");s.textContent=x;s.onclick=()=>{txt.value+=x;txt.focus()};emo.appendChild(s)});
$("#emojiBtn").onclick=()=>emo.classList.toggle("open");

/* ---------- menu / settings ---------- */
const menu=$("#menu"),modal=$("#modal");
$("#menuBtn").onclick=e=>{e.stopPropagation();menu.classList.toggle("open")};
document.addEventListener("click",()=>menu.classList.remove("open"));
menu.onclick=e=>{const a=e.target.dataset.a;if(a==="settings")openSettings();if(a==="export")exportChat();if(a==="clear")clearChat()};
$("#who").onclick=$("#hAvatar").onclick=openSettings;
$("#back").onclick=()=>{if(history.length>1)history.back()};
function openSettings(){
  $("#sName").value=S.name;$("#sProv").value=S.provider;$("#sUrl").value=S.url;$("#sModel").value=S.model;
  $("#sKey").value=S.key;$("#sPersona").value=S.persona;toggleProv();paintHeader();modal.classList.add("open");
}
function toggleProv(){$("#customBox").style.display=$("#sProv").value==="custom"?"block":"none"}
$("#sProv").onchange=()=>{toggleProv();if($("#sProv").value==="groq")$("#sModel").value=DEF.model};
$("#closeBtn").onclick=()=>modal.classList.remove("open");
$("#saveBtn").onclick=()=>{
  S.name=$("#sName").value.trim()||DEF.name;S.provider=$("#sProv").value;S.url=$("#sUrl").value.trim()||DEF.url;
  S.model=$("#sModel").value.trim()||DEF.model;S.key=$("#sKey").value.trim();
  S.persona=$("#sPersona").value.trim()||DEF.persona;saveS();paintHeader();modal.classList.remove("open");
};
$("#picBtn").onclick=$("#sAvatar").onclick=()=>$("#avPic").click();
$("#avPic").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{S.avatar=await resizeImg(f,256,.85);saveS();paintHeader()}catch(_){}
};
$("#viewer").onclick=()=>$("#viewer").classList.remove("open");

function exportChat(){
  menu.classList.remove("open");
  const lines=msgs.filter(m=>m.role!=="sys").map(m=>{
    const d=new Date(m.t);
    return "["+d.toLocaleDateString()+", "+fmtT(m.t)+"] "+(m.role==="user"?"Me":S.name)+": "+(m.img?"<photo> ":"")+(m.text||"");
  });
  const blob=new Blob([lines.join("\n")||"(empty chat)"],{type:"text/plain"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="WhatsApp Chat with "+S.name+".txt";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
async function clearChat(){
  menu.classList.remove("open");
  if(!confirm("Clear the entire chat? This can't be undone."))return;
  await dbClear();msgs=[];chat.innerHTML="";lastDay="";lastRole="";modal.classList.remove("open");
}
$("#expBtn").onclick=exportChat;$("#clrBtn").onclick=clearChat;

/* ---------- PWA ---------- */
function makeIcon(size){
  const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");
  x.fillStyle="#075E54";x.fillRect(0,0,size,size);
